name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Verify (Linux-checkable logic)
        run: dotnet run --project WinCleanup/WinCleanup.csproj -c Release -- --self-test
      - name: Publish win-x64 single-file
        run: >
          dotnet publish WinCleanup/WinCleanup.csproj -c Release -r win-x64
          --self-contained -p:PublishSingleFile=true
          -o ./publish/win-x64
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/win-x64/WinCleanup.exe
          generate_release_notes: true
